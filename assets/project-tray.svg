<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Folder Back Tab -->
  <path d="M16 28 C16 23.5 19.5 20 24 20 L50 20 C54 20 57 23 60 27 L66 35 L104 35 C108.5 35 112 38.5 112 43 L112 55 L16 55 Z" fill="url(#tabGrad)" />

  <!-- Folder Main Body -->
  <rect x="16" y="38" width="96" height="70" rx="8" fill="url(#folderGrad)" filter="url(#shadow)" />

  <!-- Terminal / Code Badge inside folder -->
  <rect x="28" y="52" width="72" height="44" rx="6" fill="#0f172a" opacity="0.9" />

  <!-- Window controls dots -->
  <circle cx="36" cy="60" r="2.5" fill="#ef4444" />
  <circle cx="43" cy="60" r="2.5" fill="#f59e0b" />
  <circle cx="50" cy="60" r="2.5" fill="#10b981" />

  <!-- Terminal prompt '> _' -->
  <path d="M36 72 L44 78 L36 84" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="48" y1="84" x2="58" y2="84" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
</svg>
